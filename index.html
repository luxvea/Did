<script>
(function() {
    const SPREADSHEET_ID = '14PUCxuzhxooIdQJpuNCIqhrA___NSO6gEqpfXsj2ACc';
    const STORAGE_KEY = 'fateer_orders_v5';
    const DELETED_KEY = 'fateer_deleted_v5';

    let allOrders = [];
    let deletedOrderTexts = [];
    let pendingDeleteIndex = -1;

    // ==================== Modal ====================
    function openConfirm(index) {
        pendingDeleteIndex = index;
        document.getElementById('confirmOverlay').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }
    window.closeConfirm = function() {
        document.getElementById('confirmOverlay').style.display = 'none';
        document.body.style.overflow = '';
        pendingDeleteIndex = -1;
    };
    window.confirmDelete = function() {
        document.getElementById('confirmOverlay').style.display = 'none';
        document.body.style.overflow = '';
        if (pendingDeleteIndex >= 0) {
            executeDelete(pendingDeleteIndex);
            pendingDeleteIndex = -1;
        }
    };

    document.addEventListener('DOMContentLoaded', function() {
        const overlay = document.getElementById('confirmOverlay');
        if (overlay) overlay.addEventListener('click', function(e) { if (e.target === overlay) closeConfirm(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeConfirm(); });
        const si = document.getElementById('searchInput');
        if (si) si.addEventListener('keypress', function(e) { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
        updateClearButton();
    });

    function executeDelete(index) {
        if (index < 0 || index >= allOrders.length) return;
        const order = allOrders[index];
        deletedOrderTexts.push(order.text);
        allOrders.splice(index, 1);
        saveStorage();
        updateStats();
        const query = document.getElementById('searchInput').value.trim();
        if (query) doSearch(true);
        else renderAllOrders();
        if (allOrders.length === 0 && !document.getElementById('searchInput').value.trim()) {
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('ordersContainer').innerHTML = '';
        }
        showToast('🗑️ تم حذف الطلب | اضغط "استعادة الكل" للتراجع');
    }

    // ==================== Toast ====================
    let toastTimer;
    function showToast(msg, dur) {
        dur = dur || 2800;
        const t = document.getElementById('app-toast');
        clearTimeout(toastTimer);
        t.textContent = msg;
        t.style.opacity = '1';
        t.style.transform = 'translateX(-50%) translateY(0)';
        toastTimer = setTimeout(function() {
            t.style.opacity = '0';
            t.style.transform = 'translateX(-50%) translateY(100px)';
        }, dur);
    }

    // ==================== Storage ====================
    function loadStorage() {
        try {
            const s = localStorage.getItem(STORAGE_KEY);
            const d = localStorage.getItem(DELETED_KEY);
            if (s) allOrders = JSON.parse(s);
            if (d) deletedOrderTexts = JSON.parse(d);
        } catch(e) { allOrders = []; deletedOrderTexts = []; }
    }
    function saveStorage() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(allOrders));
            localStorage.setItem(DELETED_KEY, JSON.stringify(deletedOrderTexts));
        } catch(e) { showToast('⚠️ سعة التخزين ممتلئة'); }
    }

    // ==================== CSV Parser ====================
    function parseCSV(txt) {
        const lines = [];
        let cur = '', q = false;
        for (let i = 0; i < txt.length; i++) {
            const c = txt[i];
            if (c === '"') {
                if (q && i+1 < txt.length && txt[i+1] === '"') { cur += '"'; i++; }
                else q = !q;
            } else if (c === '\n' && !q) { lines.push(cur); cur = ''; }
            else cur += c;
        }
        if (cur) lines.push(cur);
        return lines;
    }
    function parseCSVLine(line) {
        const parts = [];
        let cur = '', q = false;
        for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') {
                if (q && i+1 < line.length && line[i+1] === '"') { cur += '"'; i++; }
                else q = !q;
            } else if (c === ',' && !q) { parts.push(cur); cur = ''; }
            else cur += c;
        }
        parts.push(cur);
        return parts;
    }

    // ==================== Decode HTML entities ====================
    function decodeHTMLEntities(text) {
        const txt = document.createElement('textarea');
        txt.innerHTML = text;
        let decoded = txt.value;
        // Additional decoding for common entities
        decoded = decoded.replace(/&#9473;/g, '━');
        decoded = decoded.replace(/&#9472;/g, '─');
        decoded = decoded.replace(/&#8226;/g, '•');
        decoded = decoded.replace(/&#8203;/g, '');
        decoded = decoded.replace(/&amp;/g, '&');
        decoded = decoded.replace(/&lt;/g, '<');
        decoded = decoded.replace(/&gt;/g, '>');
        decoded = decoded.replace(/&quot;/g, '"');
        decoded = decoded.replace(/&#39;/g, "'");
        decoded = decoded.replace(/&#160;/g, ' ');
        return decoded;
    }

    // ==================== Extract Info ====================
    function extractPhone(text) {
        const patterns = [/الهاتف\s*[:\s]\s*(\d[\d\s\-\(\)]*\d)/i, /رقم الهاتف\s*[:\s]\s*(\d[\d\s\-\(\)]*\d)/i, /الجوال\s*[:\s]\s*(\d[\d\s\-\(\)]*\d)/i, /رقم\s*[:\s]\s*(\d{7,})/i, /هاتف\s*[:\s]\s*(\d[\d\s\-\(\)]*\d)/i];
        for (let p=0; p<patterns.length; p++) { const m = text.match(patterns[p]); if (m) return m[1].replace(/[\s\-\(\)]/g,'').trim(); }
        const fb = text.match(/(\d{7,})/);
        return fb ? fb[1] : '';
    }
    function extractName(text) {
        const patterns = [/الاسم\s*[:\s]\s*([^\n]+)/i, /اسم المشتري\s*[:\s]\s*([^\n]+)/i, /الزبون\s*[:\s]\s*([^\n]+)/i];
        for (let p=0; p<patterns.length; p++) { const m = text.match(patterns[p]); if (m) return m[1].trim(); }
        return '';
    }

    // ==================== Fetch ====================
    async function fetchOrders() {
        const url = 'https://docs.google.com/spreadsheets/d/' + SPREADSHEET_ID + '/gviz/tq?tqx=out:csv&sheet=Sheet1';
        const resp = await fetch(url);
        const txt = await resp.text();
        const lines = parseCSV(txt);
        const fresh = [];
        for (let i=1; i<lines.length; i++) {
            const parts = parseCSVLine(lines[i]);
            if (parts.length >= 2) {
                let text = parts[1].replace(/^"|"$/g, '');
                if (!text.trim()) continue;
                // Decode HTML entities to get clean text
                text = decodeHTMLEntities(text);
                const phone = extractPhone(text);
                const name = extractName(text);
                fresh.push({ 
                    id: 'ord_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,8), 
                    time: parts[0].replace(/"/g,''), 
                    text: text, 
                    phone: phone, 
                    name: name,
                    // Create a searchable string
                    searchText: (text + ' ' + phone + ' ' + name).toLowerCase()
                });
            }
        }
        return fresh.reverse();
    }

    // ==================== Merge ====================
    function mergeOrders(fresh) {
        const existing = allOrders.map(function(o){ return o.text; });
        let nc = 0;
        for (let i=0; i<fresh.length; i++) {
            const o = fresh[i];
            if (existing.indexOf(o.text) === -1 && deletedOrderTexts.indexOf(o.text) === -1) {
                allOrders.unshift(o);
                existing.unshift(o.text);
                nc++;
            }
        }
        const seen = {};
        const unique = [];
        for (let i=0; i<allOrders.length; i++) {
            const k = allOrders[i].text;
            if (!seen[k]) { seen[k]=true; unique.push(allOrders[i]); }
        }
        allOrders = unique;
        return nc;
    }

    function updateStats() {
        const stats = document.getElementById('orders-stats');
        const total = allOrders.length;
        const del = deletedOrderTexts.length;
        let txt = '📊 ' + total + ' طلب';
        if (del > 0) txt += ' | 🗑️ ' + del + ' محذوف';
        stats.textContent = txt;
    }

    // ==================== Build HTML ====================
    function buildCards(ordersArray) {
        let html = '';
        for (let i=0; i<ordersArray.length; i++) {
            const order = ordersArray[i];
            const realIndex = allOrders.indexOf(order);
            const escaped = order.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
            html += '<div class="order-card-animated" style="animation-delay:'+(i*0.04)+'s;background:#fff;border-radius:18px;padding:22px 20px 20px;box-shadow:0 2px 16px rgba(0,0,0,0.05);border-right:5px solid #0f3460;position:relative;transition:all 0.25s;"'+
                 ' onmouseover="this.style.boxShadow=\'0 8px 28px rgba(0,0,0,0.1)\';this.style.transform=\'translateX(-3px)\'"'+
                 ' onmouseout="this.style.boxShadow=\'0 2px 16px rgba(0,0,0,0.05)\';this.style.transform=\'translateX(0)\'">'+
                '<div style="font-size:11px;color:#64748b;margin-bottom:14px;background:#f1f5f9;padding:5px 14px;border-radius:20px;display:inline-block;font-weight:500;">🕐 '+order.time+'</div>'+
                '<div class="order-card-actions" style="position:absolute;top:18px;left:18px;display:flex;gap:8px;">'+
                    '<button onclick="copyOrderText('+realIndex+', this)" title="نسخ" style="width:38px;height:38px;background:#0f3460;color:#fff;border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;" onmouseover="this.style.background=\'#1a1a2e\';this.style.transform=\'scale(1.1)\'" onmouseout="this.style.background=\'#0f3460\';this.style.transform=\'scale(1)\'">'+
                        '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'+
                    '</button>'+
                    '<button onclick="deleteOrderRequest('+realIndex+')" title="حذف" style="width:38px;height:38px;background:#fff;color:#e94560;border:2px solid #fecdd3;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;" onmouseover="this.style.background=\'#e94560\';this.style.color=\'#fff\';this.style.borderColor=\'#e94560\';this.style.transform=\'scale(1.1)\'" onmouseout="this.style.background=\'#fff\';this.style.color=\'#e94560\';this.style.borderColor=\'#fecdd3\';this.style.transform=\'scale(1)\'">'+
                        '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'+
                    '</button>'+
                '</div>'+
                '<div style="white-space:pre-wrap;font-family:\'Cairo\',\'Courier New\',monospace;font-size:13px;line-height:2;color:#1e293b;direction:rtl;text-align:right;">'+escaped+'</div>'+
            '</div>';
        }
        return html;
    }

    function renderAllOrders() {
        const container = document.getElementById('ordersContainer');
        const empty = document.getElementById('emptyState');
        const loading = document.getElementById('loadingState');
        const noRes = document.getElementById('noResultsState');
        const searchInfo = document.getElementById('searchInfo');
        if (loading) loading.style.display = 'none';
        if (noRes) noRes.style.display = 'none';
        if (searchInfo) searchInfo.style.display = 'none';
        if (allOrders.length === 0) {
            container.innerHTML = '';
            if (empty) empty.style.display = 'block';
            return;
        }
        if (empty) empty.style.display = 'none';
        updateStats();
        container.innerHTML = buildCards(allOrders);
        updateClearButton();
    }

    // ==================== SEARCH - FIXED ====================
    window.doSearch = function(silent) {
        const query = document.getElementById('searchInput').value.trim();
        const container = document.getElementById('ordersContainer');
        const noRes = document.getElementById('noResultsState');
        const empty = document.getElementById('emptyState');
        const loading = document.getElementById('loadingState');
        const searchInfo = document.getElementById('searchInfo');
        const searchInfoText = document.getElementById('searchInfoText');

        if (loading) loading.style.display = 'none';
        if (empty) empty.style.display = 'none';
        if (noRes) noRes.style.display = 'none';

        if (!query) {
            if (searchInfo) searchInfo.style.display = 'none';
            document.getElementById('orders-stats').textContent = '📊 ' + allOrders.length + ' طلب';
            renderAllOrders();
            updateClearButton();
            return;
        }

        const lowerQuery = query.toLowerCase();
        const results = [];
        
        // Loop through all orders and search in the full text
        for (let i = 0; i < allOrders.length; i++) {
            const order = allOrders[i];
            // Use the searchText field which contains decoded text + phone + name
            if (order.searchText && order.searchText.indexOf(lowerQuery) !== -1) {
                results.push(order);
            } else if (order.text.toLowerCase().indexOf(lowerQuery) !== -1) {
                // Fallback: search in the text directly
                results.push(order);
            } else if (order.phone && order.phone.indexOf(lowerQuery) !== -1) {
                // Search in phone
                results.push(order);
            } else if (order.name && order.name.toLowerCase().indexOf(lowerQuery) !== -1) {
                // Search in name
                results.push(order);
            }
        }

        // Remove duplicates
        const uniqueResults = [];
        const seen = {};
        for (let i = 0; i < results.length; i++) {
            if (!seen[results[i].id]) {
                seen[results[i].id] = true;
                uniqueResults.push(results[i]);
            }
        }

        if (searchInfo) {
            searchInfo.style.display = 'block';
            searchInfoText.textContent = '🔍 ' + uniqueResults.length + ' نتيجة بحث عن: "' + query + '"';
        }
        document.getElementById('orders-stats').textContent = '🔍 البحث: ' + uniqueResults.length + ' طلب من ' + allOrders.length;

        if (uniqueResults.length === 0) {
            container.innerHTML = '';
            if (noRes) noRes.style.display = 'block';
        } else {
            if (noRes) noRes.style.display = 'none';
            container.innerHTML = buildCards(uniqueResults);
        }
        updateClearButton();
    };

    window.clearSearch = function() {
        document.getElementById('searchInput').value = '';
        const searchInfo = document.getElementById('searchInfo');
        const noRes = document.getElementById('noResultsState');
        if (searchInfo) searchInfo.style.display = 'none';
        if (noRes) noRes.style.display = 'none';
        updateStats();
        renderAllOrders();
        updateClearButton();
    };

    function updateClearButton() {
        const btnClear = document.getElementById('btnClear');
        const query = document.getElementById('searchInput').value.trim();
        if (btnClear) {
            btnClear.style.display = query ? 'flex' : 'none';
        }
    }

    // ==================== Copy ====================
    window.copyOrderText = function(index, btn) {
        if (index < 0 || index >= allOrders.length) return;
        const text = allOrders[index].text;
        function success() {
            btn.classList.add('copy-success-anim');
            const icon = btn.querySelector('svg');
            if (icon) icon.outerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
            btn.style.background = '#10b981';
            showToast('✅ تم نسخ الطلب بنجاح');
            setTimeout(function() {
                btn.classList.remove('copy-success-anim');
                btn.style.background = '#0f3460';
                const ni = btn.querySelector('svg');
                if (ni) ni.outerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
            }, 2200);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(success).catch(function() { fallbackCopy(text, success); });
        } else { fallbackCopy(text, success); }
    };
    function fallbackCopy(text, cb) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        ta.style.top = '0';
        ta.style.left = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand('copy'); cb(); } catch(e) { showToast('⚠️ فشل النسخ'); }
        document.body.removeChild(ta);
    }

    window.deleteOrderRequest = function(index) { openConfirm(index); };

    window.restoreAllOrders = function() {
        if (deletedOrderTexts.length === 0) { showToast('ℹ️ لا توجد طلبات محذوفة'); return; }
        deletedOrderTexts = [];
        saveStorage();
        showToast('♻️ تم استعادة جميع الطلبات المحذوفة');
        refreshOrders(true);
    };

    window.refreshOrders = async function(silent) {
        const loading = document.getElementById('loadingState');
        const empty = document.getElementById('emptyState');
        const container = document.getElementById('ordersContainer');
        const noRes = document.getElementById('noResultsState');
        const searchInfo = document.getElementById('searchInfo');
        if (!silent) {
            if (loading) loading.style.display = 'block';
            if (empty) empty.style.display = 'none';
            if (noRes) noRes.style.display = 'none';
            if (searchInfo) searchInfo.style.display = 'none';
            document.getElementById('searchInput').value = '';
            container.innerHTML = '';
            updateClearButton();
        }
        try {
            const fresh = await fetchOrders();
            loadStorage();
            const nc = mergeOrders(fresh);
            saveStorage();
            updateStats();
            renderAllOrders();
            if (!silent) showToast(nc > 0 ? '✅ تم تحميل '+nc+' طلب جديد' : '✅ البيانات محدثة');
        } catch(e) {
            console.error(e);
            loadStorage();
            if (allOrders.length > 0) { updateStats(); renderAllOrders(); showToast('⚠️ تم تحميل البيانات المحفوظة محلياً'); }
            else { if (loading) loading.style.display = 'none'; if (empty) empty.style.display = 'block'; showToast('❌ فشل الاتصال'); }
        }
    };

    function init() {
        loadStorage();
        if (allOrders.length > 0) { updateStats(); renderAllOrders(); document.getElementById('loadingState').style.display = 'none'; }
        refreshOrders(true);
    }
    init();
    setInterval(function() { refreshOrders(true); }, 300000);
})();
</script>
