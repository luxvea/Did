<script>
//<![CDATA[
(function() {
    var SPREADSHEET_ID = '14PUCxuzhxooIdQJpuNCIqhrA___NSO6gEqpfXsj2ACc';
    var STORAGE_KEY = 'fateer_orders_v5';
    var DELETED_KEY = 'fateer_deleted_v5';

    var allOrders = [];
    var deletedOrderTexts = [];
    var pendingDeleteIndex = -1;

    // ==================== Modal ====================
    function openConfirm(index) {
        pendingDeleteIndex = index;
        document.getElementById('confirmOverlay').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }
    window.closeConfirm = function() {
        document.getElementById('confirmOverlay').style.display = 'none';
        document.body.style.overflow = '';
        pendingDeleteIndex = -1;
    };
    window.confirmDelete = function() {
        document.getElementById('confirmOverlay').style.display = 'none';
        document.body.style.overflow = '';
        if (pendingDeleteIndex >= 0) {
            executeDelete(pendingDeleteIndex);
            pendingDeleteIndex = -1;
        }
    };

    // ==================== DOM Ready ====================
    function onReady(fn) {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fn);
        } else {
            fn();
        }
    }

    onReady(function() {
        var overlay = document.getElementById('confirmOverlay');
        if (overlay) overlay.addEventListener('click', function(e) {
            if (e.target === overlay) closeConfirm();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeConfirm();
        });

        var si = document.getElementById('searchInput');
        if (si) {
            si.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
            });
            var debounceTimer;
            si.addEventListener('input', function() {
                clearTimeout(debounceTimer);
                var self = this;
                debounceTimer = setTimeout(function() {
                    var val = self.value.trim();
                    if (val.length >= 2) doSearch();
                    else if (val.length === 0) clearSearch();
                }, 300);
            });
        }
        updateClearButton();
    });

    function executeDelete(index) {
        if (index < 0 || index >= allOrders.length) return;
        var order = allOrders[index];
        deletedOrderTexts.push(order.text);
        allOrders.splice(index, 1);
        saveStorage();
        updateStats();
        var query = document.getElementById('searchInput').value.trim();
        if (query) doSearch();
        else renderAllOrders();
        if (allOrders.length === 0 && !query) {
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('ordersContainer').innerHTML = '';
        }
        showToast('🗑️ تم حذف الطلب');
    }

    // ==================== Toast ====================
    var toastTimer;
    function showToast(msg) {
        var t = document.getElementById('app-toast');
        clearTimeout(toastTimer);
        t.textContent = msg;
        t.style.opacity = '1';
        t.style.transform = 'translateX(-50%) translateY(0)';
        toastTimer = setTimeout(function() {
            t.style.opacity = '0';
            t.style.transform = 'translateX(-50%) translateY(100px)';
        }, 2500);
    }

    // ==================== Storage ====================
    function loadStorage() {
        try {
            var s = localStorage.getItem(STORAGE_KEY);
            var d = localStorage.getItem(DELETED_KEY);
            if (s) allOrders = JSON.parse(s);
            if (d) deletedOrderTexts = JSON.parse(d);
        } catch(e) { allOrders = []; deletedOrderTexts = []; }
    }
    function saveStorage() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(allOrders));
            localStorage.setItem(DELETED_KEY, JSON.stringify(deletedOrderTexts));
        } catch(e) {}
    }

    // ==================== CSV ====================
    function parseCSV(txt) {
        var lines = [], cur = '', q = false;
        for (var i = 0; i < txt.length; i++) {
            var c = txt[i];
            if (c === '"') {
                if (q && i+1 < txt.length && txt[i+1] === '"') { cur += '"'; i++; }
                else q = !q;
            } else if (c === '\n' && !q) { lines.push(cur); cur = ''; }
            else cur += c;
        }
        if (cur) lines.push(cur);
        return lines;
    }
    function parseCSVLine(line) {
        var parts = [], cur = '', q = false;
        for (var i = 0; i < line.length; i++) {
            var c = line[i];
            if (c === '"') {
                if (q && i+1 < line.length && line[i+1] === '"') { cur += '"'; i++; }
                else q = !q;
            } else if (c === ',' && !q) { parts.push(cur); cur = ''; }
            else cur += c;
        }
        parts.push(cur);
        return parts;
    }

    // ==================== Fetch (XMLHttpRequest للتوافق) ====================
    function fetchOrders(cb) {
        var url = 'https://docs.google.com/spreadsheets/d/' + SPREADSHEET_ID + '/gviz/tq?tqx=out:csv&sheet=Sheet1';
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.onload = function() {
            if (xhr.status === 200) {
                var lines = parseCSV(xhr.responseText);
                var fresh = [];
                for (var i = 1; i < lines.length; i++) {
                    var parts = parseCSVLine(lines[i]);
                    if (parts.length >= 2) {
                        var text = parts[1].replace(/^"|"$/g, '');
                        if (!text.trim()) continue;
                        fresh.push({
                            time: parts[0].replace(/"/g, ''),
                            text: text
                        });
                    }
                }
                fresh.reverse();
                cb(null, fresh);
            } else {
                cb('HTTP ' + xhr.status);
            }
        };
        xhr.onerror = function() { cb('network'); };
        xhr.send();
    }

    // ==================== Merge ====================
    function mergeOrders(fresh) {
        var existing = {};
        for (var i = 0; i < allOrders.length; i++) existing[allOrders[i].text] = true;
        var delSet = {};
        for (var j = 0; j < deletedOrderTexts.length; j++) delSet[deletedOrderTexts[j]] = true;
        var nc = 0;
        for (var k = 0; k < fresh.length; k++) {
            var t = fresh[k].text;
            if (!existing[t] && !delSet[t]) {
                allOrders.unshift(fresh[k]);
                existing[t] = true;
                nc++;
            }
        }
        return nc;
    }

    function updateStats() {
        var el = document.getElementById('orders-stats');
        var t = allOrders.length;
        var d = deletedOrderTexts.length;
        el.textContent = '📊 ' + t + ' طلب' + (d > 0 ? ' | 🗑️ ' + d + ' محذوف' : '');
    }

    // ==================== تمييز ====================
    function highlightText(text, query) {
        var escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        if (!query) return escaped;
        var qEsc = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        try {
            var re = new RegExp('(' + qEsc + ')', 'gi');
            return escaped.replace(re, '<span class="search-highlight">$1</span>');
        } catch(e) { return escaped; }
    }

    // ==================== بناء بطاقة (DOM بدلاً من innerHTML) ====================
    function buildCard(order, animDelay, searchQuery, isMatched) {
        var realIndex = -1;
        for (var i = 0; i < allOrders.length; i++) {
            if (allOrders[i].text === order.text) { realIndex = i; break; }
        }

        var card = document.createElement('div');
        card.className = 'order-card' + (isMatched ? ' is-matched' : '') + (!isMatched && searchQuery ? ' is-rest' : '');
        card.style.animationDelay = (animDelay * 0.04) + 's';

        // الوقت
        var timeDiv = document.createElement('div');
        timeDiv.className = 'card-time';
        timeDiv.textContent = '🕐 ' + order.time;
        card.appendChild(timeDiv);

        // شارة نتيجة مطابقة
        if (isMatched) {
            var badge = document.createElement('span');
            badge.className = 'card-badge';
            badge.textContent = '✅ نتيجة مطابقة';
            card.appendChild(badge);
        }

        // أزرار النسخ والحذف
        var actions = document.createElement('div');
        actions.className = 'card-actions';

        var copyBtn = document.createElement('button');
        copyBtn.className = 'card-action-btn btn-copy';
        copyBtn.title = 'نسخ';
        copyBtn.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
        copyBtn.setAttribute('data-idx', realIndex);
        copyBtn.addEventListener('click', function() {
            var idx = parseInt(this.getAttribute('data-idx'), 10);
            copyOrderText(idx, this);
        });

        var delBtn = document.createElement('button');
        delBtn.className = 'card-action-btn btn-del';
        delBtn.title = 'حذف';
        delBtn.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
        delBtn.setAttribute('data-idx', realIndex);
        delBtn.addEventListener('click', function() {
            var idx = parseInt(this.getAttribute('data-idx'), 10);
            openConfirm(idx);
        });

        actions.appendChild(copyBtn);
        actions.appendChild(delBtn);
        card.appendChild(actions);

        // النص
        var textDiv = document.createElement('div');
        textDiv.className = 'card-text';
        if (searchQuery && isMatched) {
            textDiv.innerHTML = highlightText(order.text, searchQuery).replace(/\n/g, '<br>');
        } else {
            textDiv.innerHTML = order.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g, '<br>');
        }
        card.appendChild(textDiv);

        return card;
    }

    // ==================== عرض الكل ====================
    function renderAllOrders() {
        var container = document.getElementById('ordersContainer');
        var empty = document.getElementById('emptyState');
        var loading = document.getElementById('loadingState');
        var noRes = document.getElementById('noResultsState');
        var searchInfo = document.getElementById('searchInfo');

        if (loading) loading.style.display = 'none';
        if (noRes) noRes.style.display = 'none';
        if (searchInfo) searchInfo.style.display = 'none';

        container.innerHTML = '';

        if (allOrders.length === 0) {
            if (empty) empty.style.display = 'block';
            return;
        }
        if (empty) empty.style.display = 'none';
        updateStats();

        for (var i = 0; i < allOrders.length; i++) {
            container.appendChild(buildCard(allOrders[i], i, '', false));
        }
        updateClearButton();
    }

    // ==================== البحث ====================
    window.doSearch = function() {
        var query = document.getElementById('searchInput').value.trim();
        var container = document.getElementById('ordersContainer');
        var noRes = document.getElementById('noResultsState');
        var empty = document.getElementById('emptyState');
        var loading = document.getElementById('loadingState');
        var searchInfo = document.getElementById('searchInfo');
        var searchInfoText = document.getElementById('searchInfoText');

        if (loading) loading.style.display = 'none';
        if (empty) empty.style.display = 'none';
        if (noRes) noRes.style.display = 'none';

        if (!query) {
            if (searchInfo) searchInfo.style.display = 'none';
            renderAllOrders();
            updateClearButton();
            return;
        }

        var lowerQuery = query.toLowerCase();
        var matched = [];
        var rest = [];

        for (var i = 0; i < allOrders.length; i++) {
            var o = allOrders[i];
            if (o.text.toLowerCase().indexOf(lowerQuery) !== -1) {
                matched.push(o);
            } else {
                rest.push(o);
            }
        }

        // معلومات البحث
        if (searchInfo) {
            searchInfo.style.display = 'block';
            if (matched.length > 0) {
                searchInfo.style.background = '#f0fdf4';
                searchInfo.style.borderColor = '#86efac';
                searchInfo.style.color = '#166534';
                searchInfoText.innerHTML = '🎯 تم العثور على <b>' + matched.length + '</b> نتيجة لـ "<b>' + query + '</b>"';
            } else {
                searchInfo.style.background = '#fef2f2';
                searchInfo.style.borderColor = '#fecaca';
                searchInfo.style.color = '#991b1b';
                searchInfoText.innerHTML = '❌ لا توجد نتائج لـ "<b>' + query + '</b>"';
            }
        }
        document.getElementById('orders-stats').textContent = '🔍 ' + matched.length + ' نتيجة من ' + allOrders.length;

        container.innerHTML = '';

        if (matched.length === 0) {
            if (noRes) noRes.style.display = 'block';
            updateClearButton();
            return;
        }
        if (noRes) noRes.style.display = 'none';

        // 1) النتائج المطابقة
        for (var m = 0; m < matched.length; m++) {
            container.appendChild(buildCard(matched[m], m, query, true));
        }

        // 2) الفاصل
        if (rest.length > 0) {
            var sep = document.createElement('div');
            sep.className = 'search-divider';
            sep.innerHTML = '<div class="divider-line"></div>' +
                '<span class="divider-label">📋 باقي الطلبات (' + rest.length + ')</span>' +
                '<div class="divider-line"></div>';
            container.appendChild(sep);

            // 3) الباقي
            for (var r = 0; r < rest.length; r++) {
                container.appendChild(buildCard(rest[r], matched.length + r, '', false));
            }
        }

        updateClearButton();
        container.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    window.clearSearch = function() {
        document.getElementById('searchInput').value = '';
        var searchInfo = document.getElementById('searchInfo');
        var noRes = document.getElementById('noResultsState');
        if (searchInfo) {
            searchInfo.style.display = 'none';
            searchInfo.style.background = '#eff6ff';
            searchInfo.style.borderColor = '#bfdbfe';
            searchInfo.style.color = '#1e40af';
        }
        if (noRes) noRes.style.display = 'none';
        renderAllOrders();
        updateClearButton();
    };

    function updateClearButton() {
        var btnClear = document.getElementById('btnClear');
        var query = document.getElementById('searchInput').value.trim();
        if (btnClear) btnClear.style.display = query ? 'inline-flex' : 'none';
    }

    // ==================== نسخ ====================
    function copyOrderText(index, btn) {
        if (index < 0 || index >= allOrders.length) return;
        var text = allOrders[index].text;
        function done() {
            btn.classList.add('copy-success-anim');
            btn.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
            btn.style.background = '#10b981';
            showToast('✅ تم نسخ الطلب');
            setTimeout(function() {
                btn.classList.remove('copy-success-anim');
                btn.style.background = '#0f3460';
                btn.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
            }, 2000);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(function() { fallbackCopy(text, done); });
        } else {
            fallbackCopy(text, done);
        }
    }
    function fallbackCopy(text, cb) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        try { document.execCommand('copy'); cb(); } catch(e) { showToast('⚠️ فشل النسخ'); }
        document.body.removeChild(ta);
    }

    window.deleteOrderRequest = function(index) { openConfirm(index); };

    window.restoreAllOrders = function() {
        if (deletedOrderTexts.length === 0) { showToast('ℹ️ لا توجد محذوفات'); return; }
        deletedOrderTexts = [];
        saveStorage();
        showToast('♻️ تم استعادة الكل');
        refreshOrders(true);
    };

    // ==================== تحديث ====================
    window.refreshOrders = function(silent) {
        var loading = document.getElementById('loadingState');
        var empty = document.getElementById('emptyState');
        var container = document.getElementById('ordersContainer');
        var noRes = document.getElementById('noResultsState');
        var searchInfo = document.getElementById('searchInfo');

        if (!silent) {
            if (loading) loading.style.display = 'block';
            if (empty) empty.style.display = 'none';
            if (noRes) noRes.style.display = 'none';
            if (searchInfo) searchInfo.style.display = 'none';
            document.getElementById('searchInput').value = '';
            container.innerHTML = '';
            updateClearButton();
        }

        fetchOrders(function(err, fresh) {
            if (!err && fresh) {
                loadStorage();
                var nc = mergeOrders(fresh);
                saveStorage();
                updateStats();
                var q = document.getElementById('searchInput').value.trim();
                if (q) doSearch(); else renderAllOrders();
                if (!silent) showToast(nc > 0 ? '✅ ' + nc + ' طلب جديد' : '✅ محدث');
            } else {
                loadStorage();
                if (allOrders.length > 0) {
                    updateStats(); renderAllOrders();
                    showToast('⚠️ بيانات محلية');
                } else {
                    if (loading) loading.style.display = 'none';
                    if (empty) empty.style.display = 'block';
                    showToast('❌ فشل الاتصال');
                }
            }
        });
    };

    // ==================== تشغيل ====================
    function init() {
        loadStorage();
        if (allOrders.length > 0) {
            updateStats();
            renderAllOrders();
            var ld = document.getElementById('loadingState');
            if (ld) ld.style.display = 'none';
        }
        refreshOrders(true);
    }
    init();
    setInterval(function() { refreshOrders(true); }, 300000);
})();
//]]>
</script>
